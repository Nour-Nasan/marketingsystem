<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delete Bazaar</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .top-bar {
            background: linear-gradient(135deg, #f58529 0%, #ec4899 50%, #a855f7 100%);
            color: white;
            padding: 0.85rem 1rem;
            border-radius: 0.75rem;
            margin-bottom: 1rem;
            font-weight: 700;
        }
    </style>
</head>
<body class="bg-gray-50">
<div class="p-4 lg:p-6 max-w-lg mx-auto">
    <div class="top-bar text-center">Delete bazaar</div>

    <div class="bg-white rounded-xl border border-red-100 p-8 text-center shadow-sm">
        <i class="fas fa-exclamation-triangle text-amber-500 text-3xl mb-4"></i>
        <h1 class="text-xl font-bold text-gray-900 mb-2">Delete this bazaar?</h1>
        <p class="text-gray-600 mb-2 font-medium">{{ bazaar.title }}</p>
        <p class="text-sm text-gray-500 mb-6">This cannot be undone.</p>

        <form method="post" class="flex flex-col sm:flex-row gap-3 justify-center">
            {% csrf_token %}
            <button type="submit" class="inline-flex justify-center items-center gap-2 px-6 py-2.5 rounded-lg bg-red-600 text-white font-semibold hover:bg-red-700">
                <i class="fas fa-trash-alt"></i> Yes, delete
            </button>
            <a href="{% url 'bazaar:my_bazaars' %}" class="inline-flex justify-center items-center gap-2 px-6 py-2.5 rounded-lg border-2 border-gray-200 text-gray-700 font-semibold hover:border-gray-300">
                Cancel
            </a>
        </form>
    </div>
</div>
</body>
</html>
