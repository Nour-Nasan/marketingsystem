{% extends "base.html" %} {% load static %} {% block content %}
<div class="container mt-5">
  <div class="card shadow-sm p-4 border-0 rounded-4">
    <h3 class="mb-4 text-center text-gradient">
      Add Comment for: {{ product.productName }}
    </h3>

    <form method="post">
      {% csrf_token %}

      <div class="mb-3">
        {{ form.text.label_tag }} {{ form.text }} {% if form.text.errors %}
        <div class="text-danger small">{{ form.text.errors }}</div>
        {% endif %}
      </div>

      <div class="d-flex justify-content-between flex-wrap gap-2">
        <button type="submit" class="btn btn-gradient">
          <i class="bi bi-chat-dots"></i> Submit Comment
        </button>
        <a
          href="{% url 'products:product_detail' product.id %}"
          class="btn btn-outline-dark"
        >
          <i class="bi bi-arrow-left"></i> Back
        </a>
      </div>
    </form>
  </div>
</div>

<style>
  .text-gradient {
    background: linear-gradient(to right, #f58529, #dd2a7b);
    background-clip: text;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  .btn-gradient {
    background: linear-gradient(to right, #f58529, #dd2a7b);
    border: none;
    color: white;
    font-weight: 500;
    border-radius: 25px;
    padding: 0.5rem 1.5rem;
    transition: 0.3s ease-in-out;
  }

  .btn-gradient:hover {
    opacity: 0.9;
  }
</style>
{% endblock %}
