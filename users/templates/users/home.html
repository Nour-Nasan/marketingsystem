<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Marketing System</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <style>
      body {
        margin: 0;
        font-family: "Segoe UI", sans-serif;
        background: linear-gradient(
          135deg,
          #feda75,
          #fa7e1e,
          #d62976,
          #962fbf,
          #4f5bd5
        );
        background-size: 200% 200%;
        animation: gradientShift 12s ease infinite;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      @keyframes gradientShift {
        0% { background-position: 0% 50%; }
        50% { background-position: 100% 50%; }
        100% { background-position: 0% 50%; }
      }

      .hero-card {
        background: white;
        border-radius: 20px;
        padding: 60px 50px;
        max-width: 700px;
        width: 90%;
        text-align: center;
        box-shadow: 0 15px 40px rgba(0, 0, 0, 0.25);
        animation: fadeIn 1s ease;
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(25px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .hero-title {
        font-size: 2.5rem;
        font-weight: 700;
        color: #d62976;
        margin-bottom: 20px;
      }

      .hero-text {
        font-size: 1.1rem;
        color: #555;
        margin-bottom: 40px;
        line-height: 1.6;
      }

      .hero-buttons {
        display: flex;
        justify-content: center;
        gap: 20px;
        flex-wrap: wrap;
      }

      .btn-login {
        padding: 14px 30px;
        border-radius: 12px;
        font-weight: 600;
        border: none;
        background: linear-gradient(to right, #feda75, #d62976, #4f5bd5);
        color: white;
        text-decoration: none;
        transition: 0.3s;
      }

      .btn-login:hover {
        transform: scale(1.05);
        opacity: 0.9;
        color: white;
      }

      .btn-register {
        padding: 14px 30px;
        border-radius: 12px;
        font-weight: 600;
        border: 2px solid #d62976;
        color: #d62976;
        background: transparent;
        text-decoration: none;
        transition: 0.3s;
      }

      .btn-register:hover {
        background-color: #d62976;
        color: white;
      }
    </style>
  </head>

  <body>
    <div class="hero-card">
      <h1 class="hero-title">Marketing & Handicrafts Platform</h1>

      <p class="hero-text">
        A modern digital platform that connects sellers and buyers,
        helping artisans and small businesses showcase their products
        and grow their reach easily and securely.
      </p>

      <div class="hero-buttons">
        <a href="{% url 'users:login' %}" class="btn-login">
          Login
        </a>
        <a href="{% url 'users:register' %}" class="btn-register">
          Create Account
        </a>
      </div>
    </div>
  </body>
</html>
