<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <style>
      body {
        background: linear-gradient(
          135deg,
          #feda75,
          #fa7e1e,
          #d62976,
          #962fbf,
          #4f5bd5
        );
        background-size: 200% 200%;
        animation: gradientShift 10s ease infinite;
        font-family: "Segoe UI", sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
      }

      @keyframes gradientShift {
        0% { background-position: 0% 50%; }
        50% { background-position: 100% 50%; }
        100% { background-position: 0% 50%; }
      }

      .login-container {
        background: white;
        padding: 35px 30px;
        border-radius: 16px;
        box-shadow: 0 8px 30px rgba(0, 0, 0, 0.2);
        width: 100%;
        max-width: 400px;
        animation: fadeIn 0.8s ease-in-out;
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(20px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      h2 {
        text-align: center;
        color: #d62976;
        margin-bottom: 25px;
        font-weight: bold;
        font-size: 1.8rem;
      }

      .form-control {
        border-radius: 10px;
        padding: 12px;
      }

      button[type="submit"] {
        width: 100%;
        background: linear-gradient(to right, #feda75, #d62976, #4f5bd5);
        color: white;
        padding: 12px;
        font-weight: bold;
        font-size: 1rem;
        border: none;
        border-radius: 10px;
        transition: 0.3s;
      }

      button[type="submit"]:hover {
        transform: scale(1.03);
        opacity: 0.9;
      }

      .messages.error {
        background-color: #f8d7da;
        color: #842029;
        padding: 12px;
        margin-top: 15px;
        border-radius: 10px;
        text-align: center;
      }

      .divider {
        text-align: center;
        margin: 20px 0;
        color: #999;
        font-size: 0.9rem;
      }

      .signup-btn {
        display: block;
        text-align: center;
        border: 2px solid #d62976;
        color: #d62976;
        padding: 10px;
        border-radius: 10px;
        font-weight: 600;
        text-decoration: none;
        transition: 0.3s;
      }

      .signup-btn:hover {
        background-color: #d62976;
        color: white;
      }
    </style>
  </head>

  <body>
    <div class="login-container">
      <h2>Login</h2>

      {% load widget_tweaks %}
      <form method="post">
        {% csrf_token %}

        <div class="mb-3">
          <label for="id_username" class="form-label">Username</label>
          {{ form.username|add_class:"form-control" }}
        </div>

        <div class="mb-3">
          <label for="id_password" class="form-label">Password</label>
          {{ form.password|add_class:"form-control" }}
        </div>

        <button type="submit">Login</button>

        {% if form.errors %}
          <div class="messages error mt-3">
            ⚠️ Invalid username or password.
          </div>
        {% endif %}
      </form>

      <div class="divider">OR</div>

      <a href="{% url 'users:register' %}" class="signup-btn">
        Create New Account
      </a>
    </div>
  </body>
</html>
