{% extends "base.html" %} {% block content %}
<div class="container mt-5 text-center" style="max-width: 600px">
  <h2 class="text-danger fw-bold mb-3">
    Are you sure you want to delete your shop?
  </h2>
  <p class="text-muted mb-4">This action cannot be undone.</p>

  <form method="post" class="d-flex justify-content-center gap-3 flex-wrap">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger px-4">Yes, Delete</button>
    <a
      href="{% url 'shops:manage_shop' %}"
      class="btn btn-outline-secondary px-4"
      >Cancel</a
    >
  </form>
</div>
{% endblock %}
