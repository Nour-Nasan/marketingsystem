{% extends "base.html" %}
{% block content %}
<div class="form-page-container">
  <div class="form-card">
    <!-- Card Header with Instagram Gradient -->
    <div class="form-card-header">
      <h2 class="form-title">Edit Shop Details</h2>
      <p class="form-subtitle">Update your shop's information below.</p>
    </div>

    <!-- Form Body -->
    <div class="form-card-body">
      <form method="post" class="shop-form">
        {% csrf_token %}
        
        <!-- Assuming {{ form.as_p }} renders form fields wrapped in <p> tags -->
        {{ form.as_p }}

        <div class="form-actions">
          <button type="submit" class="btn btn-primary">
            <span class="btn-icon">
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path>
                <polyline points="17 21 17 13 7 13 7 21"></polyline>
                <polyline points="7 3 7 8 15 8"></polyline>
              </svg>
            </span>
            Update Shop
          </button>
          <a href="{% url 'shops:manage_shop' %}" class="btn btn-secondary">
            Cancel
          </a>
        </div>
      </form>
    </div>
  </div>
</div>

<!-- Styles -->
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  /* Instagram-inspired color palette */
  :root {
    --instagram-gradient: linear-gradient(45deg, #feda75, #fa7e1e, #d62976, #962fbf, #4f5bd5);
    --primary-color: #d62976; /* Pink/Red from gradient */
    --primary-dark: #962fbf; /* Purple from gradient */
    --danger-color: #ef4444;
    --danger-dark: #dc2626;
    --success-color: #10b981;
    --text-primary: #1f2937;
    --text-secondary: #6b7280;
    --bg-light: #f9fafb;
    --bg-lighter: #f3f4f6;
    --border-color: #e5e7eb;
    --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
    --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
    --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
  }

  body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background-color: var(--bg-lighter);
    color: var(--text-primary);
    direction: ltr;
  }

  .form-page-container {
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 40px 20px;
  }

  .form-card {
    width: 100%;
    max-width: 700px;
    background: white;
    border-radius: 16px;
    box-shadow: var(--shadow-lg);
    overflow: hidden;
  }

  /* Card Header with Gradient */
  .form-card-header {
    background: var(--instagram-gradient);
    color: white;
    padding: 30px;
    text-align: center;
  }

  .form-title {
    font-size: 2rem;
    font-weight: 700;
    margin-bottom: 5px;
  }

  .form-subtitle {
    font-size: 1rem;
    opacity: 0.9;
    font-weight: 300;
  }

  .form-card-body {
    padding: 30px;
  }

  /* Form Styling */
  .shop-form p {
    margin-bottom: 15px;
  }

  .shop-form label {
    display: block;
    font-weight: 600;
    color: var(--text-primary);
    margin-bottom: 8px;
    font-size: 0.9rem;
  }

  .shop-form input,
  .shop-form textarea,
  .shop-form select {
    width: 100%;
    padding: 12px;
    border: 1px solid var(--border-color);
    border-radius: 8px;
    font-size: 1rem;
    transition: border-color 0.3s, box-shadow 0.3s;
  }

  .shop-form input:focus,
  .shop-form textarea:focus,
  .shop-form select:focus {
    outline: none;
    border-color: var(--primary-color);
    box-shadow: 0 0 0 3px rgba(214, 41, 118, 0.2); /* Light pink shadow on focus */
  }

  .shop-form textarea {
    resize: vertical;
    min-height: 100px;
  }

  /* Action Buttons */
  .form-actions {
    display: flex;
    gap: 12px;
    margin-top: 30px;
    padding-top: 20px;
    border-top: 1px solid var(--border-color);
  }

  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 12px 24px;
    border: none;
    border-radius: 10px;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.3s ease;
    text-decoration: none;
  }

  .btn-icon svg {
    width: 20px;
    height: 20px;
  }

  .btn-primary {
    background: var(--instagram-gradient);
    color: white;
    box-shadow: var(--shadow-md);
  }

  .btn-primary:hover {
    transform: translateY(-2px);
    box-shadow: 0 12px 20px -5px rgba(214, 41, 118, 0.3);
  }

  .btn-secondary {
    background-color: var(--bg-lighter);
    color: var(--text-secondary);
    border: 1px solid var(--border-color);
  }

  .btn-secondary:hover {
    background-color: var(--border-color);
    color: var(--text-primary);
  }

  /* Responsive Design */
  @media (max-width: 600px) {
    .form-actions {
      flex-direction: column;
    }

    .btn {
      width: 100%;
    }

    .form-card-header {
      padding: 20px;
    }

    .form-title {
      font-size: 1.5rem;
    }

    .form-card-body {
      padding: 20px;
    }
  }
</style>
{% endblock %}
