{% extends "base.html" %}
{% block content %}

<div class="container mt-5">

  <!-- Page Header -->
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h3 class="fw-bold text-center mb-0"
    style="color:#e11d48;">
  My Advertisements
</h3>


<a href="{% url 'advertisement:add_ad' %}"
   class="btn btn-success text-white"
   style="
     background: linear-gradient(45deg, #f58529, #dd2a7b, #8134af, #515bd4);
     border: none;
   ">
  <i class="bi bi-plus-circle me-1"></i>
  Add Advertisement
</a>

  </div>

  {% if ads %}
    <div class="row g-4">

      {% for ad in ads %}
        <div class="col-sm-6 col-md-4 col-lg-3">

          <div class="card h-100 border-0 shadow-sm
                      hover-shadow transition">

            <!-- Image Wrapper -->
            <div class="ratio ratio-4x3 bg-light rounded-top overflow-hidden">
              <img
                src="{{ ad.image.url }}"
                alt="Advertisement Image"
                class="w-100 h-100 object-fit-cover"
              >
            </div>

            <!-- Card Body -->
            <div class="card-body text-center">

              <div class="d-flex justify-content-center gap-2">

               <a href="{% url 'advertisement:edit_ad' ad.id %}"
   class="btn btn-sm d-flex align-items-center justify-content-center gap-1"
   style="
     background-color:#fde68a;
     color:#92400e;
     border:none;
     font-weight:500;
     padding:6px 10px;
   ">
  <i class="bi bi-pencil-fill"></i>
  Edit
</a>


         <a href="{% url 'advertisement:delete_ad' ad.id %}"
   class="btn btn-sm d-flex align-items-center justify-content-center gap-1"
   style="
     background-color:#fecaca;
     color:#7f1d1d;
     border:none;
     font-weight:500;
     padding:6px 10px;
   ">
  <i class="bi bi-trash3-fill"></i>
  Delete
</a>
              </div>

            </div>

          </div>

        </div>
      {% endfor %}

    </div>
  {% else %}
    <!-- Empty State -->
    <div class="text-center py-5">
      <i class="bi bi-image text-muted display-4"></i>
      <p class="text-muted mt-3 fs-5">
        You have not created any advertisements yet.
      </p>
    </div>
  {% endif %}

</div>

{% endblock %}
