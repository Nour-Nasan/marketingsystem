{% extends "base.html" %}
{% block content %}

<div class="container mt-5" style="max-width: 720px;">

  <!-- Page Header -->
  <div class="mb-4 text-center">
    <h3 class="fw-bold mb-2"
        style="
          background: linear-gradient(45deg, #f58529, #dd2a7b, #8134af, #515bd4);
          background-clip: text;
          -webkit-background-clip: text;
          -webkit-text-fill-color: transparent;
        ">
      Edit Advertisement
    </h3>
    <p class="text-muted mb-0">
      Update your advertisement image and save your changes.
    </p>
  </div>

  <!-- Current Image Preview -->
  {% if form.instance.image %}
  <div class="mb-4 text-center">

    <div class="mx-auto rounded overflow-hidden shadow-sm bg-light"
         style="max-width: 360px;">
      <div class="ratio ratio-4x3">
        <img
          src="{{ form.instance.image.url }}"
          alt="Current Advertisement Image"
          class="w-100 h-100 object-fit-cover"
        >
      </div>
    </div>

    <small class="text-muted d-block mt-2">
      Current advertisement image
    </small>

  </div>
  {% endif %}

  <!-- Form Card -->
  <div class="card border-0 shadow-sm">
    <div class="card-body p-4">

      <form method="post" enctype="multipart/form-data">
        {% csrf_token %}

        <!-- Form Fields -->
        <div class="mb-4">
          {{ form.as_p }}
        </div>

        <!-- Actions -->
        <div class="d-flex justify-content-between align-items-center">

          <!-- Back Button -->
          <a href="{% url 'advertisement:my_ads' %}"
             class="btn btn-sm d-flex align-items-center gap-1"
             style="
               background-color:#e5e7eb;
               color:#374151;
               border:none;
               padding:6px 12px;
             ">
            <i class="bi bi-arrow-left"></i>
            Back
          </a>

          <!-- Save Changes Button -->
          <button type="submit"
                  class="btn btn-sm text-white d-flex align-items-center gap-1 px-4"
                  style="
                    background: linear-gradient(45deg, #f58529, #dd2a7b, #8134af, #515bd4);
                    border:none;
                    font-weight:500;
                  ">
            <i class="bi bi-save-fill"></i>
            Save Changes
          </button>

        </div>

      </form>

    </div>
  </div>

</div>

{% endblock %}
