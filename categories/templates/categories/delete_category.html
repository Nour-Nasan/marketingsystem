{% extends "base.html" %} {% block content %}
<div class="container mt-5 text-center" style="max-width: 600px">
  <div class="card p-4 shadow-sm border-0 rounded-4">
    <h3 class="text-danger fw-bold mb-3">
      Are you sure you want to delete this category?
    </h3>
    <p>Category: <strong>{{ category.name }}</strong></p>

    <form
      method="post"
      class="d-flex justify-content-center gap-3 flex-wrap mt-4"
    >
      {% csrf_token %}
      <button type="submit" class="btn btn-danger px-4">
        <i class="bi bi-trash"></i> Yes, Delete
      </button>
      <a
        href="{% url 'categories:manage_categories' %}"
        class="btn btn-outline-secondary px-4"
      >
        Cancel
      </a>
    </form>
  </div>
</div>
{% endblock %}
