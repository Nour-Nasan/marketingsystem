{% extends "base.html" %} {% block content %}
<div class="container mt-5" style="max-width: 600px">
  <div class="card shadow-sm p-4 border-0 rounded-4">
    <h2 class="mb-3 text-gradient fw-bold text-center">
      Approve Order #{{ order.id }}
    </h2>
    <p class="text-center">
      Are you sure you want to <strong>approve</strong> this order?
    </p>

    <form
      method="post"
      class="d-flex justify-content-center gap-3 mt-4 flex-wrap"
    >
      {% csrf_token %}
      <button type="submit" class="btn btn-gradient">Yes, Approve Order</button>
      <a
        href="{% url 'orders:view_orders' %}"
        class="btn btn-outline-secondary"
      >
        Cancel
      </a>
    </form>
  </div>
</div>

<!-- Styling -->
<style>
  .btn-gradient {
    background: linear-gradient(to right, #f58529, #dd2a7b);
    color: white;
    font-weight: bold;
    border: none;
    border-radius: 30px;
    padding: 8px 25px;
  }

  .btn-gradient:hover {
    background: linear-gradient(to right, #833ab4, #e1306c);
    color: white;
  }

  .text-gradient {
    background: linear-gradient(to right, #f58529, #dd2a7b);
    background-clip: text;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }
</style>
{% endblock %}
